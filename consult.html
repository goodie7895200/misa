<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>預約諮詢｜跨領域企業經營實戰班</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1626;
    --ink-soft:#132a44;
    --ink-line: rgba(230,235,232,0.14);
    --blueprint:#3a6ea5;
    --paper:#e7ecee;
    --paper-2:#d7dfe2;
    --paper-line: rgba(30,58,95,0.14);
    --gold:#b8933f;
    --gold-bright:#d4af5a;
    --text-on-ink:#eef0ea;
    --text-on-ink-muted: rgba(238,240,234,0.66);
    --text-on-paper:#122033;
    --text-on-paper-muted: rgba(18,32,51,0.62);
    --serif: "Noto Serif TC", "Songti TC", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --mono: "IBM Plex Mono", "Noto Sans TC", monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 78% 0%, rgba(184,147,63,0.14), transparent 60%),
      linear-gradient(180deg,#0b1626 0%, #0d1c30 100%);
    color:var(--text-on-ink);
    font-family:var(--sans);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
    padding:56px 20px 80px;
  }
  h1,h2{ font-family:var(--serif); font-weight:700; margin:0; }
  a{ color:inherit; }
  .mono{ font-family:var(--mono); }

  .back{
    align-self:flex-start;
    max-width:640px; width:100%; margin:0 auto 28px;
    font-family:var(--mono); font-size:0.85rem; letter-spacing:0.04em;
    color:var(--text-on-ink-muted); text-decoration:none;
  }
  .back:hover{ color:var(--gold-bright); }

  .card{
    width:100%; max-width:640px;
    background:var(--paper); color:var(--text-on-paper);
    border-radius:4px; padding:44px 40px 40px;
    box-shadow:0 30px 70px rgba(0,0,0,0.35);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size:44px 44px;
    opacity:0.5; pointer-events:none;
  }
  .card > *{ position:relative; }

  .eyebrow{
    font-family:var(--mono); font-size:0.78rem; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--blueprint); display:block; margin-bottom:14px;
  }
  h1.title{ font-size:clamp(1.5rem,3.4vw,2rem); margin-bottom:12px; }
  .lead{ font-size:0.98rem; color:var(--text-on-paper-muted); max-width:52ch; margin-bottom:34px; }

  form{ display:flex; flex-direction:column; gap:20px; }
  .field{ display:flex; flex-direction:column; gap:8px; }
  .field label{ font-family:var(--mono); font-size:0.82rem; letter-spacing:0.03em; color:var(--text-on-paper); }
  .field label .req{ color:var(--blueprint); margin-left:2px; }
  .field input{
    font-family:var(--sans); font-size:1rem; color:var(--text-on-paper);
    background:#fff; border:1px solid var(--paper-line); border-radius:3px;
    padding:13px 14px; outline:none;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .field input:focus{ border-color:var(--blueprint); box-shadow:0 0 0 3px rgba(58,110,165,0.15); }
  .field input::placeholder{ color:rgba(18,32,51,0.35); }

  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }

  .submit-row{ margin-top:10px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  button.btn-gold{
    font-family:var(--sans); font-weight:700; font-size:1rem;
    background:var(--gold); color:#0b1626; border:none; border-radius:6px;
    padding:16px 32px; cursor:pointer;
    transition:background 0.25s ease, transform 0.25s ease;
  }
  button.btn-gold:hover{ background:var(--gold-bright); transform:translateY(-2px); }
  button.btn-gold:disabled{ opacity:0.6; cursor:default; transform:none; }
  .alt-note{ font-size:0.86rem; color:var(--text-on-paper-muted); }
  .alt-note a{ color:var(--blueprint); text-decoration:underline; }

  .disclaimer{ margin-top:28px; font-size:0.78rem; color:var(--text-on-paper-muted); border-top:1px dashed var(--paper-line); padding-top:18px; }

  /* success state */
  .success{ display:none; text-align:center; padding:30px 0 10px; }
  .success.show{ display:block; }
  .success .mark{
    width:56px; height:56px; border-radius:50%; background:var(--blueprint); color:#fff;
    display:flex; align-items:center; justify-content:center; margin:0 auto 22px;
    font-size:1.6rem; font-family:var(--serif);
  }
  .success h2{ font-size:1.4rem; margin-bottom:12px; }
  .success p{ color:var(--text-on-paper-muted); font-size:0.95rem; max-width:44ch; margin:0 auto; }

  #hidden_iframe{ display:none; }
</style>
</head>
<body>

  <a class="back" href="index.html">← 返回課程頁</a>

  <div class="card">
    <span class="eyebrow">跨領域企業經營實戰班・預約諮詢</span>
    <h1 class="title">留下您的資料，<br>我們安排學習顧問與您聯繫</h1>
    <p class="lead">請填寫以下資訊，瀚將教育學習顧問 Kelly 將盡快與您聯繫，說明課程細節、梯次安排或企業內訓合作方式。</p>

    <form id="consult-form" target="hidden_iframe" method="POST" action="https://script.google.com/macros/s/AKfycby0pd5Zx5g9I626NleuDaiVTHGXxkWcMfcT6UnoGIB4l1LrAjdNgT8VsQmsK4DKmzDnBQ/exec">
      <div class="field">
        <label for="name">姓名<span class="req">*</span></label>
        <input type="text" id="name" name="name" required placeholder="請輸入姓名">
      </div>

      <div class="row2">
        <div class="field">
          <label for="company">公司名稱</label>
          <input type="text" id="company" name="company" placeholder="請輸入公司名稱">
        </div>
        <div class="field">
          <label for="title">職稱</label>
          <input type="text" id="title" name="title" placeholder="例如：總經理">
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="phone">聯絡電話<span class="req">*</span></label>
          <input type="tel" id="phone" name="phone" required placeholder="0912-345-678">
        </div>
        <div class="field">
          <label for="email">Email<span class="req">*</span></label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>
      </div>

      <div class="field">
        <label for="contactTime">方便聯繫的時間</label>
        <input type="text" id="contactTime" name="contactTime" placeholder="例如：平日下午2點後">
      </div>

      <div class="submit-row">
        <button type="submit" class="btn-gold" id="submit-btn">送出預約</button>
        <span class="alt-note">或直接致電 <a href="tel:0906223562">0906-223-562</a> 洽詢</span>
      </div>

      <p class="disclaimer">※ 您所留下的聯絡資訊僅供瀚將教育科技安排課程諮詢使用，不會作其他用途。</p>
    </form>

    <div class="success" id="success-block">
      <div class="mark">✓</div>
      <h2>已收到您的資料</h2>
      <p>感謝您的預約，學習顧問 Kelly 將盡快與您聯繫。若急需聯繫，也歡迎直接致電 0906-223-562。</p>
    </div>
  </div>

  <iframe name="hidden_iframe" id="hidden_iframe"></iframe>

  <script>
    var form = document.getElementById('consult-form');
    var btn = document.getElementById('submit-btn');
    var iframe = document.getElementById('hidden_iframe');
    var successBlock = document.getElementById('success-block');
    var formSubmitted = false;
    var done = false;

    function showSuccess(){
      if(done) return;
      done = true;
      form.style.display = 'none';
      successBlock.classList.add('show');
    }

    form.addEventListener('submit', function(){
      btn.disabled = true;
      btn.textContent = '送出中…';
      formSubmitted = true;
      // fallback in case the iframe's load event doesn't fire in this browser
      setTimeout(showSuccess, 4000);
    });

    iframe.addEventListener('load', function(){
      if(!formSubmitted) return; // ignore the iframe's own initial blank load
      showSuccess();
    });
  </script>

</body>
</html>
