<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>預約諮詢｜跨領域企業經營實戰班</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- Cloudflare Turnstile：防機器人驗證元件 -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root{
    --paper:#fdfdfc;
    --paper-2:#f6f5f3;
    --ink:#231f20;
    --ink-2:#4a4546;
    --muted:#6f6a6b;
    --line:#e6e3e1;
    --field-line:#8c8687;
    --red:#ef2d32;
    --error:#c8161c;
    --orange:#f68712;
    --yellow:#fedd03;
    --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --num:"Archivo","Noto Sans TC",sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --gut:clamp(20px,5vw,64px);
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100dvh; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.7; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  img{ max-width:100%; height:auto; display:block; }
  a{ color:inherit; }
  h1,h2,p{ margin:0; }
  .wrap{ max-width:1240px; margin:0 auto; padding:0 var(--gut); width:100%; }

  /* brand motifs */
  .rule{ display:block; width:clamp(120px,14vw,190px); height:10px; background:var(--ink); }
  .dots{ display:grid; grid-template-columns:repeat(6,8px); gap:18px 26px; }
  .dots i{ width:8px; height:8px; border-radius:50%; background:var(--red); }
  .dots i.o{ visibility:hidden; }

  /* nav */
  .nav{ border-bottom:1px solid var(--line); background:var(--paper); }
  .nav .wrap{ height:72px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .nav .lockup{ height:38px; width:auto; }
  .back{ text-decoration:none; font-weight:500; font-size:0.92rem; color:var(--ink-2); display:inline-flex; align-items:center; gap:8px; white-space:nowrap; transition:color .2s; }
  .back:hover{ color:var(--red); }
  .back .arr{ font-family:var(--num); }

  /* layout */
  main{ flex:1; }
  .page{ display:grid; grid-template-columns:5fr 7fr; gap:clamp(40px,7vw,112px); align-items:start; padding-top:clamp(56px,8vw,96px); padding-bottom:clamp(72px,9vw,120px); }
  .intro{ position:sticky; top:48px; }
  .intro .rule{ margin-bottom:30px; }
  .intro h1{ font-size:clamp(1.9rem,3.2vw,2.7rem); font-weight:900; line-height:1.32; letter-spacing:0.02em; margin-bottom:22px; }
  .intro .course{ display:block; color:var(--red); font-weight:700; letter-spacing:0.1em; font-size:0.9rem; margin-bottom:14px; }
  .intro .lead{ color:var(--ink-2); font-size:1.02rem; max-width:30em; }
  .owl{ width:clamp(120px,12vw,168px); margin:48px 0 40px; }
  .call{ border-left:4px solid var(--red); padding-left:20px; }
  .call span{ display:block; font-size:0.9rem; color:var(--muted); }
  .call a{ font-family:var(--num); font-weight:800; font-size:1.6rem; letter-spacing:-0.01em; text-decoration:none; }
  .call a:hover{ color:var(--red); }

  /* form */
  .panel{ border-top:10px solid var(--ink); padding-top:40px; }
  form{ display:grid; gap:28px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  .field{ display:flex; flex-direction:column; gap:8px; }
  .field label{ font-size:0.92rem; font-weight:700; color:var(--ink); }
  .field label .req{ color:var(--red); margin-left:3px; }
  .field label .opt{ color:var(--muted); font-weight:400; font-size:0.82rem; margin-left:6px; }
  .field input{
    font-family:var(--sans); font-size:1.05rem; color:var(--ink);
    background:transparent; border:0; border-bottom:2px solid var(--field-line); border-radius:0;
    padding:10px 2px 12px; outline:none; transition:border-color .2s var(--ease), background .2s var(--ease);
  }
  .field input:hover{ border-bottom-color:var(--ink); }
  .field input:focus{ border-bottom-color:var(--red); background:var(--paper-2); }
  .field input:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
  .field input::placeholder{ color:#8c8687; }

  .turnstile-wrap{ display:flex; justify-content:flex-start; min-height:65px; }

  .submit-row{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; margin-top:4px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; white-space:nowrap; font-family:var(--sans); font-size:1rem; font-weight:700; letter-spacing:0.08em; padding:16px 36px; background:var(--ink); color:#fdfdfc; border:2px solid var(--ink); border-radius:0; cursor:pointer; text-decoration:none; transition:background .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease); }
  .btn:hover{ background:var(--red); border-color:var(--red); }
  .btn:active{ transform:translateY(1px) scale(0.98); }
  .btn:disabled{ opacity:0.55; cursor:default; transform:none; background:var(--ink); border-color:var(--ink); }
  .btn .arr{ font-family:var(--num); }
  .alt-note{ font-size:0.92rem; color:var(--ink-2); }
  .alt-note a{ font-family:var(--num); font-weight:700; color:var(--ink); text-underline-offset:3px; }
  .alt-note a:hover{ color:var(--red); }

  .form-msg{ font-size:0.95rem; font-weight:500; margin:0; min-height:1.4em; }
  .form-msg.error{ color:var(--error); }
  .form-msg.info{ color:var(--muted); }

  .disclaimer{ font-size:0.85rem; color:var(--muted); border-top:1px solid var(--line); padding-top:18px; }

  /* success */
  .success{ display:none; padding:12px 0 8px; }
  .success.show{ display:block; animation:enter .7s var(--ease) both; }
  .success .mark{ width:64px; height:64px; background:var(--red); color:#fdfdfc; display:flex; align-items:center; justify-content:center; font-family:var(--num); font-size:1.8rem; font-weight:800; margin-bottom:28px; }
  .success h2{ font-size:clamp(1.6rem,2.6vw,2.1rem); font-weight:900; margin-bottom:14px; }
  .success p{ color:var(--ink-2); max-width:34em; margin-bottom:32px; }
  .success .dots{ margin-top:48px; }

  /* footer */
  .foot{ border-top:10px solid var(--ink); padding:40px 0 36px; }
  .foot .wrap{ display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap; }
  .foot .lockup{ height:42px; width:auto; }
  .foot p{ font-size:0.9rem; color:var(--ink-2); }
  .foot .tel{ font-family:var(--num); font-weight:800; color:var(--ink); font-size:1.1rem; text-decoration:none; }

  /* entrance */
  .enter{ animation:enter .9s var(--ease) both; animation-delay:calc(var(--d,0) * 120ms + 80ms); }
  @keyframes enter{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){
    .enter,.success.show{ animation:none; }
    .btn,.field input{ transition:none; }
  }

  @media (max-width:900px){
    .page{ grid-template-columns:1fr; }
    .intro{ position:static; }
    .owl{ display:none; }
    .call{ margin-top:28px; }
  }
  @media (max-width:560px){
    .nav .wrap{ height:64px; }
    .nav .lockup{ height:28px; }
    .row2{ grid-template-columns:1fr; }
    .btn{ width:100%; }
    .foot .lockup{ height:34px; }
  }
</style>

<script>
  // 這個網址請換成你自己的 Cloudflare Worker 網址（SETUP.md 步驟 5-3）
  // 例如：https://misa-consult-form.你的帳號.workers.dev
  var WORKER_URL = "https://misa-consult-form.goodie7895200.workers.dev";

  var form = document.getElementById('consult-form');
  var btn = document.getElementById('submit-btn');
  var msg = document.getElementById('form-msg');
  var successBlock = document.getElementById('success-block');

  function showSuccess(){
    form.style.display = 'none';
    successBlock.classList.add('show');
    successBlock.focus();
  }

  function showError(text){
    msg.textContent = text;
    msg.className = 'form-msg error';
    btn.disabled = false;
    btn.textContent = '送出預約';
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();

    // 必填欄位檢查（姓名、電話、Email）
    var firstInvalid = null;
    ['name','phone','email'].forEach(function(id){
      var el = document.getElementById(id);
      var bad = !el.checkValidity();
      el.setAttribute('aria-invalid', bad ? 'true' : 'false');
      el.style.borderBottomColor = bad ? 'var(--error)' : '';
      if (bad && !firstInvalid) firstInvalid = el;
    });
    if (firstInvalid) {
      showError('請填寫姓名、聯絡電話與正確的 Email');
      firstInvalid.focus();
      return;
    }

    var turnstileField = form.querySelector('[name="cf-turnstile-response"]');
    if (!turnstileField || !turnstileField.value) {
      showError('請完成驗證方塊後再送出');
      return;
    }

    var payload = {
      name: form.name.value,
      company: form.company.value,
      title: form.title.value,
      phone: form.phone.value,
      email: form.email.value,
      contactTime: form.contactTime.value,
      turnstileToken: turnstileField.value,
    };

    btn.disabled = true;
    btn.textContent = '送出中…';
    msg.textContent = '';

    try {
      var res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      var result = await res.json();

      if (result.ok) {
        showSuccess();
      } else {
        showError(result.error || '送出失敗，請稍後再試或直接來電：07-9623079');
        if (window.turnstile) window.turnstile.reset();
      }
    } catch (err) {
      showError('網路異常，請稍後再試或直接來電：07-9623079');
      if (window.turnstile) window.turnstile.reset();
    }
  });
</script>
